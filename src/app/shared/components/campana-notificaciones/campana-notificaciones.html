<div class="campana">
    <!-- Botón propio y no el genérico del navbar: con notificaciones sin leer
         cambia de ícono (campana sonando), se tiñe y el contador lleva un anillo
         blanco para despegarse del ícono. Un badge plano sobre la campana gris
         pasaba desapercibido, que es justo lo contrario de lo que tiene que
         hacer un aviso. -->
    <button class="campana__btn" [class.campana__btn--activa]="sinLeer() > 0"
        [class.campana__btn--abierta]="abierto()" (click)="alternar()"
        [attr.aria-label]="sinLeer() > 0 ? sinLeer() + ' notificaciones sin leer' : 'Notificaciones'">
        <i class="ti" [class.ti-bell]="sinLeer() === 0" [class.ti-bell-ringing-2]="sinLeer() > 0"></i>
        @if (sinLeer() > 0) { <span class="campana__badge">{{ badge() }}</span> }
    </button>

    @if (abierto()) {
    <!-- Capa a pantalla completa para cerrar al hacer click fuera, sin tener
         que escuchar el click de todo el documento. -->
    <div class="campana__fuera" (click)="cerrar()"></div>

    <div class="campana__panel">
        <div class="campana__head">
            <strong>Notificaciones</strong>
            @if (sinLeer() > 0) {
            <button class="campana__link" (click)="marcarTodas()">Marcar todas como leídas</button>
            }
        </div>

        @if (cargando()) {
        <div class="campana__vacio"><i class="ti ti-loader-2 spin"></i> Cargando...</div>
        } @else if (items().length === 0) {
        <div class="campana__vacio">
            <i class="ti ti-bell-off"></i>
            <p>Sin notificaciones</p>
        </div>
        } @else {
        <ul class="campana__lista">
            @for (n of items(); track n.id_notificacion) {
            <li class="campana__item" [class.campana__item--nueva]="!n.leida" (click)="abrirNotificacion(n)">
                <i class="ti campana__icono" [ngClass]="icono(n.tipo)"></i>
                <div class="campana__texto">
                    <strong>{{ n.titulo }}</strong>
                    @if (n.mensaje) { <span class="text-sm text-muted">{{ n.mensaje }}</span> }
                    <span class="text-sm text-muted">{{ n.fecha | fecha:true }}</span>
                </div>
            </li>
            }
        </ul>
        }
    </div>
    }
</div>
