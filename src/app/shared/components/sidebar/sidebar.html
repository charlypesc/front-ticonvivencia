<!-- En celular el menú se abre encima del contenido: el fondo oscuro lo
     cierra al tocar afuera, igual que elegir una opción. -->
@if (estado.abierto()) {
<div class="sidebar-fondo" (click)="estado.cerrarMovil()"></div>
}
<aside class="sidebar" [class.sidebar--colapsado]="estado.colapsado()" [class.sidebar--abierto]="estado.abierto()">
    <nav class="sidebar__nav">
        @for (item of items(); track item.route) {
        <a [routerLink]="item.route" routerLinkActive="sidebar__item--active" class="sidebar__item"
            [title]="estado.colapsado() ? item.label : ''" (click)="estado.cerrarMovil()">
            <i class="ti {{ item.icon }}"></i>
            <span>{{ item.label }}</span>
        </a>
        }
    </nav>
</aside>
