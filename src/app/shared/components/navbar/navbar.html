<header class="navbar">
    <div class="navbar__brand">
        <img src="logo.png" alt="MiConvivencia" class="navbar__logo" />
        <span>MiConvivencia</span>
    </div>

    <!-- Solo se muestra para el ADMIN: es global y tiene que elegir en qué
         establecimiento está trabajando, o el backend le responde 400. -->
    <app-selector-establecimiento />

    <div class="navbar__right">
        <app-campana-notificaciones />

        <!-- Quién eres y dónde estás trabajando. El establecimiento va acá y no
             en el sidebar porque es lo que distingue una sesión de otra: con
             varios colegios abiertos en pestañas, el nombre y el RBD son lo
             único que evita registrar el caso en el colegio equivocado. -->
        <div class="navbar__user" [title]="usuario()?.correo">
            <div class="navbar__avatar">{{ iniciales() }}</div>
            <div class="navbar__quien">
                <span class="navbar__saludo">Bienvenido, <strong>{{ nombreCorto() }}</strong></span>
                @if (establecimiento(); as est) {
                <span class="navbar__establecimiento">
                    <i class="ti ti-school"></i>
                    {{ est.nombre }}@if (est.rbd) { · RBD {{ est.rbd }} }
                </span>
                }
            </div>
        </div>

        <button class="navbar__icon-btn" (click)="mostrarCambiarPassword.set(true)"
            title="Cambiar contraseña">
            <i class="ti ti-lock"></i>
        </button>

        <button class="navbar__icon-btn" (click)="logout()" title="Cerrar sesión">
            <i class="ti ti-logout"></i>
        </button>
    </div>
</header>

@if (mostrarCambiarPassword()) {
<app-cambiar-password-modal (cerrar)="mostrarCambiarPassword.set(false)" />
}
