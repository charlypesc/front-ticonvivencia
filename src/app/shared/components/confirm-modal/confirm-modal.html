@if (confirmService.state(); as state) {
<div class="modal-backdrop" (mousedown)="$event.target === $event.currentTarget ? confirmService.resolver(false) : null">
    <div class="modal modal--sm" (click)="$event.stopPropagation()">
        <div class="modal__header">
            <h3>
                <i class="ti {{ state.icono ?? 'ti-alert-triangle' }}"></i>
                {{ state.titulo ?? 'Confirmar acción' }}
            </h3>
            <button class="modal__close" (click)="confirmService.resolver(false)">
                <i class="ti ti-x"></i>
            </button>
        </div>

        <div class="modal__body">
            <p class="confirm-mensaje">{{ state.mensaje }}</p>

            <!-- El motivo se escribe acá, no en la pantalla de atrás: es parte
                 de la decisión que se está confirmando y sólo existe mientras
                 dura. -->
            @if (state.campo; as campo) {
            <div class="form-group">
                <label>
                    {{ campo.etiqueta }}
                    @if (campo.obligatorio) { <span class="req">*</span> }
                    @else { <span class="text-muted text-sm">(opcional)</span> }
                </label>
                <textarea rows="3" [ngModel]="state.texto" (ngModelChange)="confirmService.escribir($event)"
                    name="confirm_texto" [placeholder]="campo.placeholder ?? ''" autofocus></textarea>
                @if (state.error) {
                <p class="text-sm confirm-error">{{ state.error }}</p>
                }
            </div>
            }
        </div>

        <div class="modal__footer">
            @if (state.soloAviso) {
            <button class="btn btn--primary" (click)="confirmService.resolver(false)">Entendido</button>
            } @else {
            <button class="btn btn--outline" (click)="confirmService.resolver(false)">Cancelar</button>
            <button class="btn btn--danger" (click)="confirmService.resolver(true)">Confirmar</button>
            }
        </div>
    </div>
</div>
}
