<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contacto — miConvivencia</title>
<meta name="description" content="Tarjeta de contacto de Ricardo Paredes, miConvivencia: gestión de la convivencia escolar." />
<link rel="icon" type="image/png" href="contacto/logo.png" />
<link rel="stylesheet" href="contacto/tarjeta.css" />

<body>

<article class="card" data-name="Ricardo Paredes" data-tel="+56979796198" data-emails="ventas@miconvivencia.cl,contacto@miconvivencia.cl">
  <div class="card-top">
    <img class="logo-mark" src="contacto/logo.png" alt="miConvivencia" />
    <div class="brand">
      <span class="logo-text">miConvivencia</span>
      <span class="logo-sub">Convivencia escolar</span>

  <div class="qr-wrap">
    <div class="qr-box"><canvas id="qr"></canvas></div>
    <div class="qr-hint"><strong>Escanea para guardar</strong><span class="qr-hint-detalle">El código QR agrega el contacto directamente a tu teléfono.</span></div>
  </div>

  <div class="person">
    <h2>Ricardo Paredes</h2>
  </div>
  <div class="fields">
    <a class="field" href="tel:+56979796198"><span class="label">Tel.</span><span class="value">+56 9 7979 6198</span></a>
    <a class="field" href="mailto:ventas@miconvivencia.cl"><span class="label">Ventas</span><span class="value">ventas@miconvivencia.cl</span></a>
    <a class="field" href="mailto:contacto@miconvivencia.cl"><span class="label">Contacto</span><span class="value">contacto@miconvivencia.cl</span></a>
    <a class="field" href="https://miconvivencia.cl"><span class="label">Web</span><span class="value">miconvivencia.cl</span></a>
  </div>

  <div class="rubros">
    <span class="rubro">Protocolos</span>
    <span class="rubro">Seguimiento de casos</span>
    <span class="rubro">Expedientes</span>
    <span class="rubro">Ley 21.809</span>
  </div>

  <div class="acciones">
    <button type="button" class="btn btn--primario" id="guardar">Guardar contacto</button>
    <a class="btn btn--whatsapp" href="https://wa.me/56979796198?text=Hola%2C%20quiero%20saber%20m%C3%A1s%20sobre%20miConvivencia" target="_blank" rel="noopener">WhatsApp</a>
  </div>
</article>

<script src="contacto/qrcode.js"></script>
<script src="contacto/tarjeta.js"></script>

</html>
