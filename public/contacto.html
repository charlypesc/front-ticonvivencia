<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contacto — miConvivencia</title>
<meta name="description" content="Tarjeta de contacto de miConvivencia: gestión de la convivencia escolar." />
<link rel="icon" type="image/png" href="contacto/logo.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap');

  /* Mismos tokens que la landing (miconvivencia.cl) */
  :root{
    --petroleo:#23535f;
    --petroleo-osc:#173c45;
    --azul:#3d94ad;
    --celeste:#66e3ff;
    --celeste-suave:#7ecbe9;
    --fondo:#f3f8fb;
    --blanco:#ffffff;
    --texto:#16323a;
    --texto-suave:#4a6570;
    --borde:#d8e6ec;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--fondo);
    color:var(--texto);
    font-family:'Source Sans 3',-apple-system,sans-serif;
    padding:40px 16px 56px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }

  .card{
    width:100%;
    max-width:400px;
    background:var(--blanco);
    border:1px solid var(--borde);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(22,50,58,.08), 0 12px 32px rgba(22,50,58,.12);
    text-align:center;
  }

  .card-top{
    background:linear-gradient(160deg,var(--petroleo) 0%,var(--petroleo-osc) 100%);
    color:var(--blanco);
    padding:28px 24px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .logo-mark{
    width:84px;
    height:84px;
    object-fit:contain;
    background:var(--blanco);
    border-radius:50%;
    padding:10px;
  }
  .logo-text{
    font-family:'Lexend',sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.3px;
  }
  .logo-text span{color:var(--celeste)}
  .logo-sub{
    font-size:14px;
    color:var(--celeste-suave);
  }

  .body{
    padding:24px 24px 28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }

  .fields{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .field{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 14px;
    border:1px solid var(--borde);
    border-radius:10px;
    color:var(--texto);
    text-decoration:none;
    text-align:left;
    transition:border-color .15s ease, background .15s ease;
  }
  .field:hover{border-color:var(--azul);background:var(--fondo)}
  .field .label{
    width:74px;
    flex-shrink:0;
    font-family:'Lexend',sans-serif;
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--azul);
  }
  .field .value{
    font-size:15px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    word-break:break-all;
  }

  .acciones{
    width:100%;
    display:flex;
    gap:8px;
  }
  .btn{
    flex:1;
    font-family:'Lexend',sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:10px;
    padding:12px 10px;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
  }
  .btn--primario{background:var(--petroleo);color:var(--blanco)}
  .btn--primario:hover{background:var(--petroleo-osc)}
  .btn--whatsapp{background:#25d366;color:#0b3d1f}
  .btn--whatsapp:hover{background:#1ebe5a}

  .qr-wrap{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding-top:20px;
    border-top:1px solid var(--borde);
  }
  .qr-box{
    background:var(--blanco);
    border:1px solid var(--borde);
    border-radius:10px;
    padding:10px;
    line-height:0;
  }
  .qr-box canvas{
    display:block;
    width:180px;
    height:180px;
  }
  .qr-hint{
    font-size:13px;
    color:var(--texto-suave);
    line-height:1.5;
  }
  .qr-hint strong{
    display:block;
    color:var(--texto);
    font-size:14px;
    margin-bottom:2px;
  }

  .web{
    font-size:13px;
    color:var(--azul);
    text-decoration:none;
    font-weight:600;
  }
  .web:hover{text-decoration:underline}
</style>
</head>
<body>

<article class="card">
  <div class="card-top">
    <img class="logo-mark" src="contacto/logo.png" alt="miConvivencia" />
    <div class="logo-text">mi<span>Convivencia</span></div>
    <div class="logo-sub">Gestión de la convivencia escolar</div>
  </div>

  <div class="body">
    <div class="fields">
      <a class="field" href="tel:+56990769101"><span class="label">Tel.</span><span class="value">+56 9 9076 9101</span></a>
      <a class="field" href="mailto:ventas@miconvivencia.cl"><span class="label">Ventas</span><span class="value">ventas@miconvivencia.cl</span></a>
      <a class="field" href="mailto:contacto@miconvivencia.cl"><span class="label">Contacto</span><span class="value">contacto@miconvivencia.cl</span></a>
    </div>

    <div class="acciones">
      <button type="button" class="btn btn--primario" id="guardar">Guardar contacto</button>
      <a class="btn btn--whatsapp" href="https://wa.me/56990769101?text=Hola%2C%20quiero%20saber%20m%C3%A1s%20sobre%20miConvivencia" target="_blank" rel="noopener">WhatsApp</a>
    </div>

    <div class="qr-wrap">
      <div class="qr-box"><canvas id="qr"></canvas></div>
      <div class="qr-hint"><strong>Escanea para guardar</strong>El código QR agrega el contacto directamente a tu teléfono.</div>
    </div>

    <a class="web" href="https://miconvivencia.cl">miconvivencia.cl</a>
  </div>
</article>

<script src="contacto/qrcode.js"></script>
<script>
  var VCARD = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:;miConvivencia;;;',
    'FN:miConvivencia',
    'ORG:miConvivencia',
    'TEL;TYPE=CELL:+56990769101',
    'EMAIL;TYPE=WORK:ventas@miconvivencia.cl',
    'EMAIL;TYPE=WORK:contacto@miconvivencia.cl',
    'URL:https://miconvivencia.cl',
    'NOTE:Gestión de la convivencia escolar',
    'END:VCARD'
  ].join('\r\n');

  // qrcode.js codifica en bytes UTF-8 si se le pide; sin esto las tildes salen rotas al escanear
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  var qr = qrcode(0, 'M');
  qr.addData(VCARD, 'Byte');
  qr.make();

  var canvas = document.getElementById('qr');
  var cell = qr.getModuleCount();
  var scale = 6;
  canvas.width = cell * scale;
  canvas.height = cell * scale;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#16323a';
  for(var r=0;r<cell;r++){
    for(var c=0;c<cell;c++){
      if(qr.isDark(r,c)){
        ctx.fillRect(c*scale, r*scale, scale, scale);
      }
    }
  }

  // En el celular, abrir el .vcf lanza "Agregar a contactos"
  document.getElementById('guardar').addEventListener('click', function(){
    var blob = new Blob([VCARD], {type:'text/vcard;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'miConvivencia.vcf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
</script>
</body>
</html>
